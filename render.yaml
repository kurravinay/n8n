services:
  # Main n8n web application
  - type: web
    name: n8n-main
    runtime: docker
    dockerfile: Dockerfile
    plan: starter
    region: oregon 
    envVars:
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_RUNNERS_MODE
        value: "external"
      # FIX 1: Allow internal port 5679 to accept connections over Render's private network
      - key: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
        value: "0.0.0.0"
      - key: N8N_RUNNERS_AUTH_TOKEN
        generateValue: true
      - key: PORT
        value: "5678"
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 10

  # External Python Task Runner (Private Worker)
  - type: worker
    name: n8n-python-runner
    runtime: docker
    dockercontext: .
    dockerfile: Dockerfile.runner
    plan: starter
    region: oregon 
    envVars:
      - key: N8N_RUNNERS_LAUNCHER
        value: "python"
      # FIX 2: Authorize the script executions within the sidecar
      - key: N8N_RUNNERS_EXTERNAL_ALLOW
        value: "*"
      - key: N8N_RUNNERS_AUTH_TOKEN
        fromService:
          type: web
          name: n8n-main
          envVarKey: N8N_RUNNERS_AUTH_TOKEN
      - key: N8N_RUNNERS_TASK_BROKER_URI
        value: "http://n8n-main:5679"
